{name: CI, on: {push: {branches: [main, master]}, pull_request: {branches: [main, master]}}, jobs: {quality: {name: "Lint, typecheck, unit tests, build", runs-on: ubuntu-latest, steps: [{uses: "actions/checkout@v4"}, {uses: "actions/setup-node@v4", with: {node-version: "20", cache: "npm"}}, {run: "npm ci"}, {run: "npm run typecheck"}, {run: "npm run lint"}, {run: "npm run format:check"}, {run: "npm run test"}, {run: "npm run build"}]}, e2e: {name: "Playwright E2E", runs-on: ubuntu-latest, needs: quality, steps: [{uses: "actions/checkout@v4"}, {uses: "actions/setup-node@v4", with: {node-version: "20", cache: "npm"}}, {run: "npm ci"}, {name: "Install Playwright browsers", run: "npx playwright install --with-deps chromium"}, {name: "Run E2E tests", run: "npm run test:e2e", env: {CI: true}}, {uses: "actions/upload-artifact@v4", if: "failure()", with: {name: "playwright-report", path: "playwright-report/\ntest-results/", retention-days: 7}}]}}}
